name: Build Android App (APK & AAB)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Native Platform Files & Dependencies
        run: |
          cd mobile_flutter
          flutter create . --org com.blazenxt --project-name bunkmeter
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile_flutter
          flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: |
          cd mobile_flutter
          flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkMeter-Release-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: BunkMeter-PlayStore-AAB
          path: mobile_flutter/build/app/outputs/bundle/release/app-release.aab
